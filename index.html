<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120d19">
  <meta name="description" content="Uma surpresa feita com carinho para a minha Macaquinha.">
  <title>Para minha Macaquinha ♡</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="Voltar ao começo"><span class="brand-icon">♡</span><span>Para Minha Amada</span></a>
    <div class="topbar-right"><span class="date-tag">quase 1 ano de nós</span><button id="sound-toggle"
        class="sound-toggle" type="button" aria-pressed="false" title="Ligar a música">♫</button></div>
  </header>
  <main id="inicio" class="app-shell">
    <div class="journey-head"><span id="step-count">UM CANTINHO NOSSO</span>
      <div class="progress-track" role="progressbar" aria-label="Progresso das cartinhas" aria-valuemin="0"
        aria-valuemax="7" aria-valuenow="0"><span id="progress-fill"></span></div>
    </div>
    <section id="story-stage" class="story-stage" aria-live="polite" aria-atomic="true"></section>
    <footer class="app-footer"><span>feito à mão, pensando em você</span><span class="footer-heart">♥</span></footer>
  </main>
  <audio id="background-music" src="assets/audio/musica.mp3" loop preload="none"></audio>
  <script src="game.js"></script>
</body>

</html>
